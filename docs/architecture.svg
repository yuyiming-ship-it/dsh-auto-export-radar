<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="中国汽车出海雷达数据流">
  <rect width="960" height="420" fill="#0F1115"/>
  <g font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" fill="#E8EAED">
    <text x="40" y="52" font-size="20" font-weight="600">中国汽车出海雷达 · 数据流</text>
    <text x="40" y="76" font-size="12" fill="#9AA0A6">每 20 分钟一轮 · 74 个渠道 · 标题自动翻中文 · 面板内读正文</text>

    <!-- 渠道层 -->
    <rect x="40" y="108" width="250" height="240" rx="14" fill="#1B1F27" stroke="#2E3440"/>
    <text x="60" y="136" font-size="13" font-weight="600" fill="#8AB4F8">① 渠道层</text>
    <text x="60" y="162" font-size="11.5" fill="#C9CDD3">Google News 本地版 × 26</text>
    <text x="60" y="182" font-size="11" fill="#7F858C">阿语 5 · 俄语 4 · 法语 3 · 西语 3</text>
    <text x="60" y="202" font-size="11" fill="#7F858C">中英日韩德波斯土泰越印尼</text>
    <text x="60" y="228" font-size="11.5" fill="#C9CDD3">行业 RSS × 48</text>
    <text x="60" y="248" font-size="11" fill="#7F858C">阿语 7 · 俄语 6 · 波斯语 10</text>
    <text x="60" y="268" font-size="11" fill="#7F858C">法语 7 · 英文/西语/东南亚</text>
    <text x="60" y="294" font-size="11.5" fill="#C9CDD3">自定义 RSS / OPML</text>
    <text x="60" y="314" font-size="11" fill="#7F858C">社交源（可选，需桥或令牌）</text>
    <text x="60" y="336" font-size="10.5" fill="#6B7178">单源 15s 超时 · 429 退避重试</text>

    <path d="M300 228 L346 228" stroke="#4C566A" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- 处理层 -->
    <rect x="352" y="108" width="250" height="240" rx="14" fill="#1B1F27" stroke="#2E3440"/>
    <text x="372" y="136" font-size="13" font-weight="600" fill="#F6BD60">② 处理层</text>
    <text x="372" y="164" font-size="11.5" fill="#C9CDD3">品牌 / 中国信号 / 车相关词</text>
    <text x="372" y="184" font-size="10.5" fill="#7F858C">「日本批评出口管制」这类噪音被挡掉</text>
    <text x="372" y="212" font-size="11.5" fill="#C9CDD3">时间窗口裁剪 + 标题/链接去重</text>
    <text x="372" y="240" font-size="11.5" fill="#C9CDD3">主题分类</text>
    <text x="372" y="260" font-size="10.5" fill="#7F858C">关税 / 建厂 / 销量 / 渠道 / 物流 / 产品</text>
    <text x="372" y="288" font-size="11.5" fill="#C9CDD3">按语种轮转取件</text>
    <text x="372" y="308" font-size="10.5" fill="#7F858C">避免某个垂类源刷满结果</text>
    <text x="372" y="334" font-size="10.5" fill="#6B7178">条目池 300 条 / 保留 10 天</text>

    <path d="M612 228 L658 228" stroke="#4C566A" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- 服务层 -->
    <rect x="664" y="108" width="256" height="240" rx="14" fill="#1B1F27" stroke="#2E3440"/>
    <text x="684" y="136" font-size="13" font-weight="600" fill="#A5D6A7">③ 服务层</text>
    <text x="684" y="164" font-size="11.5" fill="#C9CDD3">中文标题</text>
    <text x="684" y="184" font-size="10.5" fill="#7F858C">公开翻译接口 → 失败回退当前模型</text>
    <text x="684" y="212" font-size="11.5" fill="#C9CDD3">正文抽取</text>
    <text x="684" y="232" font-size="10.5" fill="#7F858C">容器识别 + 移动端 UA 兜底 · 缓存 14 天</text>
    <text x="684" y="260" font-size="11.5" fill="#C9CDD3">正文翻译</text>
    <text x="684" y="280" font-size="10.5" fill="#7F858C">8 段一批 · 失败不顶掉正文</text>
    <text x="684" y="308" font-size="11.5" fill="#C9CDD3">阅读状态 / 订阅 / 设置</text>
    <text x="684" y="328" font-size="10.5" fill="#7F858C">$DSH_HOME/auto-export-radar/*.json</text>

    <!-- 出口 -->
    <rect x="40" y="372" width="880" height="0" fill="none"/>
    <path d="M480 348 L480 366" stroke="#4C566A" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="236" y="366" width="490" height="40" rx="10" fill="#12202E" stroke="#2B4A68"/>
    <text x="256" y="391" font-size="12" fill="#8AB4F8">④ 出口：左侧栏面板（实时流 / 收藏 / 渠道 / 设置 + 阅读器）· 工具 auto_export_radar · skill</text>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4C566A"/>
    </marker>
  </defs>
</svg>
